<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCII portrait test</title>
    <style>
      @font-face {
        font-family: "Bounded";
        src: url("assets/bounded-variable.ttf") format("truetype");
        font-weight: 100 900;
      }

      :root { background: #efeeec; color: #0a0a0a; font-family: "Bounded", Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; background: #efeeec; }
      main { display: grid; min-height: 100svh; grid-template-columns: minmax(220px, 0.6fr) minmax(0, 1.4fr); gap: clamp(24px, 5vw, 96px); align-items: center; max-width: 1440px; margin: 0 auto; padding: clamp(24px, 5vw, 80px); }
      .copy { max-width: 360px; }
      .eyebrow { margin: 0 0 20px; color: #6d6d68; font-size: 12px; line-height: 18px; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(30px, 4vw, 60px); font-weight: 450; line-height: 1.08; letter-spacing: 0; }
      .description { margin: 24px 0 0; color: #6d6d68; font-family: Arial, sans-serif; font-size: 16px; line-height: 1.45; }
      .controls { display: grid; gap: 16px; margin-top: 40px; }
      label { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; color: #0a0a0a; font-size: 12px; line-height: 16px; }
      input { grid-column: 1 / -1; width: 100%; accent-color: #0a0a0a; }
      output { color: #6d6d68; }
      .portrait-shell { position: relative; display: grid; overflow: hidden; width: min(100%, 760px); aspect-ratio: 0.82; place-items: center; border-radius: 8px; background: #0a0a0a; box-shadow: 0 24px 60px rgba(0,0,0,.13); }
      .portrait-shell::before { position: absolute; z-index: 1; top: 18px; left: 18px; color: #d8ff9d; content: "LIVE / ASCII"; font-size: 11px; line-height: 1; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
      .note { position: absolute; z-index: 1; right: 18px; bottom: 18px; margin: 0; color: rgba(255,255,255,.58); font-family: Arial, sans-serif; font-size: 12px; }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; gap: 36px; padding: 24px; } .copy { max-width: none; } .controls { margin-top: 28px; } .portrait-shell { width: 100%; max-height: 62svh; } }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main>
      <section class="copy" aria-labelledby="title">
        <p class="eyebrow">Avatar study / 01</p>
        <h1 id="title">Лицо,<br />собранное<br />из текста.</h1>
        <p class="description">Проверяем не эффект ради эффекта, а насколько узнаваемым и спокойным остаётся портрет.</p>
        <div class="controls" aria-label="Настройки эффекта">
          <label>Плотность <output id="densityValue">78</output><input id="density" type="range" min="40" max="120" value="78" /></label>
          <label>Контраст <output id="contrastValue">1.28</output><input id="contrast" type="range" min="80" max="180" value="128" /></label>
        </div>
      </section>
      <section class="portrait-shell" aria-label="ASCII-портрет">
        <canvas id="portrait" width="720" height="880"></canvas>
        <p class="note">Движение добавим после выбора статики</p>
      </section>
    </main>
    <script>
      const image = new Image();
      const canvas = document.getElementById("portrait");
      const context = canvas.getContext("2d");
      const samplingCanvas = document.createElement("canvas");
      const samplingContext = samplingCanvas.getContext("2d", { willReadFrequently: true });
      const density = document.getElementById("density");
      const contrast = document.getElementById("contrast");
      const densityValue = document.getElementById("densityValue");
      const contrastValue = document.getElementById("contrastValue");
      const glyphs = " .,:;i1tfLCG08@";

      function draw() {
        if (!image.complete || !image.naturalWidth) return;
        const columns = Number(density.value);
        const ratio = image.naturalHeight / image.naturalWidth;
        const rows = Math.round(columns * ratio * 0.57);
        samplingCanvas.width = columns;
        samplingCanvas.height = rows;
        samplingContext.drawImage(image, 0, 0, columns, rows);
        const pixels = samplingContext.getImageData(0, 0, columns, rows).data;
        const width = canvas.width;
        const height = canvas.height;
        const cellWidth = width / columns;
        const cellHeight = height / rows;
        const contrastFactor = Number(contrast.value) / 100;

        context.fillStyle = "#0a0a0a";
        context.fillRect(0, 0, width, height);
        context.fillStyle = "#efeeec";
        context.font = `${Math.ceil(cellHeight * 1.08)}px Bounded, monospace`;
        context.textBaseline = "top";

        for (let y = 0; y < rows; y += 1) {
          for (let x = 0; x < columns; x += 1) {
            const pixel = (y * columns + x) * 4;
            const luminance = (pixels[pixel] * 0.2126 + pixels[pixel + 1] * 0.7152 + pixels[pixel + 2] * 0.0722) / 255;
            const value = Math.max(0, Math.min(1, (luminance - 0.5) * contrastFactor + 0.5));
            const glyph = glyphs[Math.floor(value * (glyphs.length - 1))];
            if (glyph !== " ") context.fillText(glyph, x * cellWidth, y * cellHeight);
          }
        }
      }

      function update() {
        densityValue.value = density.value;
        contrastValue.value = (Number(contrast.value) / 100).toFixed(2);
        draw();
      }

      density.addEventListener("input", update);
      contrast.addEventListener("input", update);
      image.addEventListener("load", update);
      image.src = "assets/avatar/ascii-portrait-poster.jpg";
    </script>
  </body>
</html>
